[project]
name = "tic_tac_toe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]


[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]


[tool.ruff]
line-length = 88
extend-exclude = ["**/migrations/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "T20", "PT", "RUF"]

ignore = [
    "E501",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
    "C408"
]
fixable = ["ALL"]
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "config.py",
    "env.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"

disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

exclude = [
    "^\\.venv/",
    "migrations/",
    "config\\.py$",
    "env\\.py$",
]
