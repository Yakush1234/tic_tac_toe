# Refresh Docker DNS when the backend container is recreated.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream game_api {
    zone game_api 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~ ^/(games(/|$)|docs(/oauth2-redirect)?$|redoc$|openapi\.json$) {
        proxy_pass http://game_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
